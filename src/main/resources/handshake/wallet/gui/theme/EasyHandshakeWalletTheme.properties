# Easy Handshake Wallet -- "Slate & Silver" theme.
# Colors extracted directly from the project's own icon, then verified
# and iterated on through real HTML mockups before being finalized here.
# Only overriding what's needed on top of FlatDarkLaf's own defaults --
# see this project's own note on why (avoids fragile upgrades).

#---- root variables (cascade automatically through most components) ----

@background = #10151c
@foreground = #e6e8ea
@accentColor = #7fa3ad

#---- shape: sharp, "engraved panel" corners, not rounded SaaS cards ----

Component.arc = 0
Button.arc = 0
TextComponent.arc = 0
ProgressBar.arc = 0

#---- beige focus glow on input fields (and other focusable components) ----
# 0 by default in FlatLaf's own base theme -- explicitly turned on here.

Component.focusWidth = 2
Component.focusColor = #d0c1a5
Component.focusedBorderColor = #d0c1a5

#---- application-specific tokens for custom components (sidebar, panels) ----
#     read via UIManager.getColor(...) in the wallet's own Swing code,
#     not consumed by any stock FlatLaf component directly.

EasyHandshakeWallet.background = #10151c
EasyHandshakeWallet.sidebarBackground = #0c1016
EasyHandshakeWallet.panelBackground = #1a232e
EasyHandshakeWallet.borderMetal = #3f4a56
EasyHandshakeWallet.textPrimary = #e6e8ea
EasyHandshakeWallet.silver = #b7b9be
EasyHandshakeWallet.accentPrimary = #7fa3ad
EasyHandshakeWallet.accentSecondary = #d0c1a5
EasyHandshakeWallet.navActive = #d0c1a5

# A genuinely new concern (input validation errors) this project's
# earlier, badge-derived palette never needed -- a warm, moderate red
# rather than a harsh, saturated one, kept in the same muted register
# as the rest of this theme instead of clashing sharply against it.
EasyHandshakeWallet.danger = #d97b6c